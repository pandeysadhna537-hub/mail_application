<!DOCTYPE html>
<html>

<head>
    <title>Send Email</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            width: 320px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 6px;
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 15px;
            padding: 8px;
            box-sizing: border-box;
            /* Ensures padding doesn't affect width */
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Send Email</h2>

        <form id="emailForm">
            <label for="to">To:</label>
            <input type="email" id="to" placeholder="recipient@gmail.com" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" placeholder="Enter subject" required>

            <label for="message">Message:</label>
            <textarea id="message" rows="4" placeholder="Enter message" required></textarea>

            <button type="submit">Send</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusDiv.style.color = 'black';
            statusDiv.innerText = 'Sending...';

            const data = {
                to: document.getElementById('to').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            try {
                const res = await fetch('/api/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    statusDiv.style.color = 'green';
                    statusDiv.innerText = result.message;
                    form.reset();
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.innerText = 'Error: ' + result.error;
                }
            } catch (err) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Failed to connect to backend server.';
            }
        });
    </script>

</body>

</html>
